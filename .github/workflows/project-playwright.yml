---
name: Project Playwright E2E

# Run Vue Playwright E2E tests independently from the regular build and test flow.

on:
  workflow_call:
    inputs:
      app:
        description: Vue app path under apps/
        required: true
        type: string
      node-runtime:
        description: Node runtime (such as `node@24`)
        default: 'node@lts'
        type: string
      playwright-image:
        description: Image to use for Playwright testing
        default: 'mcr.microsoft.com/playwright:v1.57.0'
        type: string
      runner:
        description: Runner label for the Playwright job
        default: 'ubuntu-latest'
        type: string
      test-timeout:
        description: Time in minutes after which the test job will timeout
        default: 30
        type: number

jobs:
  playwright:
    name: Playwright E2E ${{ inputs.app }}
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.playwright-image }}
      options: --user 1001
    timeout-minutes: ${{ inputs.test-timeout }}
    steps:
      - name: Setup Node environment
        id: setup
        uses: wisemen-digital/devops-github-actions/.github/actions/project/setup@v1
        with:
          apps: '[{"path":"${{ inputs.app }}"}]'
          node-runtime: ${{ inputs.node-runtime }}
      - name: Build application
        run: |
          if test -f 'turbo.json'; then
            pnpm build --filter ${{ inputs.app }}
          else
            pnpm --recursive --filter ${{ inputs.app }} build
          fi
      - name: Run Playwright E2E tests
        uses: wisemen-digital/devops-github-actions/.github/actions/project/test-stack@v1
        with:
          app: ${{ inputs.app }}
          stack: playwright
