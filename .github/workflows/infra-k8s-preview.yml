---
name: Build & Test Infrastructure

#
# Generate previews for k8s changes
#

on:
  workflow_call:
    # Depends on the following vars
    # - RUNNER_DEFAULT
    secrets:
      K8S_MODULES_SECRET:
        description: Token to access github modules repositories
        required: false

jobs:
  # Won't do anything outside PR, otherwise comment fails
  preview-k8s:
    name: Diff with k8s
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER_DEFAULT || 'ubuntu-latest' }}
    steps:
      - name: Generate changed paths
        id: changed-paths-filter
        uses: wisemen-digital/devops-ga-changed-paths-filter@main
        with:
          filter-file: .github/k8s-rollout-filters.yaml
      - name: Ensure access to private repositories
        shell: bash
        run: |
          if [ "${{ secrets.K8S_MODULES_SECRET }}" != "null" ]; then
            AUTH="x-access-token:${{ secrets.K8S_MODULES_SECRET }}"
            git config --global url."https://${AUTH}@github.com/".insteadOf "git@github.com:"
          fi
      - name: Generate diffs
        id: preview
        run: |
          changed_paths=`echo $matrix | jq -r '.[].path'`

          if [ -z "$changed_paths" ]; then
            echo "No changed k8s paths; nothing to preview."
            exit 0
          fi

          # Generate new content
          while IFS= read -r path; do
            echo "Processing new $path…"
            mkdir -p `dirname diff-new/$path`
            if [ -e "$path" ]; then
              kubectl kustomize "$path" > "diff-new/$path"
            else
              touch "diff-new/$path"
            fi
          done <<< "$changed_paths"

          # Checkout main
          echo "Switching to main branch…"
          git remote set-branches origin main
          git fetch --quiet --depth 1 origin main
          git checkout --quiet main

          # Generate old content
          while IFS= read -r path; do
            echo "Processing old $path…"
            mkdir -p `dirname diff-old/$path`
            if [ -e "$path" ]; then
              kubectl kustomize "$path" > "diff-old/$path"
            else
              touch "diff-old/$path"
            fi
          done <<< "$changed_paths"

          # Generate diffs. A PR comment holds at most 65536 characters and step outputs have a
          # size limit too, so large diffs (e.g. installing an operator with big CRDs) are
          # summarised in the comment and printed in full in this job's log instead.
          echo "Generating diffs…"
          max_path_bytes=20000
          max_total_bytes=60000
          total=0
          : > comment.md
          while IFS= read -r path; do
            diff -u "diff-old/$path" "diff-new/$path" > path.diff || true
            size=$(wc -c < path.diff | tr -d " ")
            echo "<details><summary>$path</summary>" >> comment.md
            if [ "$size" -gt "$max_path_bytes" ] || [ $((total + size)) -gt "$max_total_bytes" ]; then
              added=$(grep -c '^+[^+]' path.diff || true)
              removed=$(grep -c '^-[^-]' path.diff || true)
              kinds=$(grep -E '^[+-]kind: ' path.diff | sort | uniq -c | awk '{printf "%s%s ×%s, ", substr($2, 1, 1), $3, $1}' | sed 's/, $//')
              echo -e "\nDiff too large for a comment ($size bytes: +$added/-$removed lines). Objects: ${kinds:-none}. Full diff in the job log.\n" >> comment.md
              echo "::group::Full diff for $path"
              cat path.diff
              echo "::endgroup::"
            else
              echo -e '\n```diff' >> comment.md
              cat path.diff >> comment.md
              echo -e '```\n' >> comment.md
              total=$((total + size))
            fi
            echo "</details>" >> comment.md
          done <<< "$changed_paths"
          {
            echo 'contents<<EOF'
            cat comment.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          matrix: ${{ steps.changed-paths-filter.outputs.matrix }}
      - name: Comment PR with preview
        if: "${{ steps.preview.outputs.contents != '' }}"
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            K8S Previews
            ${{ steps.preview.outputs.contents }}
          comment-tag: k8s-preview
