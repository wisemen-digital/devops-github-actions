---
name: Format, Build & Test Flutter app

#
# Format, build, analyze & test a Flutter application
# Note: code is generated once with Melos and shared with the test jobs as an artifact.
#

on:
  workflow_call:
    inputs:
      build-timeout:
        description: Time (in minutes) after which the code generation will timeout
        default: 5
        type: number
      test-timeout:
        description: Time (in minutes) after which the tests will timeout
        default: 5
        type: number
      test-coverage:
        description: Minimum test coverage required (defaults to 0)
        default: 0
        type: number
      skip-formatting:
        description: Skip formatting check (defaults to false)
        default: false
        type: boolean
      skip-reporting:
        description: Skip reporting coverage to Codecov (defaults to false)
        default: false
        type: boolean
      use-melos:
        description: Deprecated, Melos is always used for code generation
        default: true
        type: boolean
      flutter-version:
        description: Flutter version to use, e.g. 3.35.4 or 3.35.x (defaults to the latest stable version)
        default: ''
        type: string
      generate-network:
        description: Generate the network package in packages/generated_network with swagger_parser (defaults to true)
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-matrix:
    name: Generate job matrices
    runs-on: ubuntu-latest
    outputs:
      deployments: ${{ steps.changed-paths-filter.outputs.matrix }}
    steps:
      - name: Generate Matrix
        id: changed-paths-filter
        uses: wisemen-digital/devops-ga-changed-paths-filter@main
        with:
          filter-file: .github/package-filters.yaml

  generate-code:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.build-timeout }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter-version }}
          cache: true
      - name: Run flutter pub get
        run: flutter pub get --enforce-lockfile
      - name: Verify formatting
        if: ${{ !inputs.skip-formatting }}
        run: dart format . --set-exit-if-changed
      - name: Generate intl
        run: |
          dart pub global activate intl_utils
          dart pub global run intl_utils:generate
      - name: Generate network package
        if: ${{ inputs.generate-network && hashFiles('packages/generated_network/pubspec.yaml') != '' }}
        working-directory: packages/generated_network
        run: dart run swagger_parser
      - name: Generate code with Melos
        run: dart run melos run build --no-select
      - name: Upload generated code
        uses: actions/upload-artifact@v4
        with:
          name: generated-code
          path: |
            lib
            packages

  test:
    needs: [generate-matrix, generate-code]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.test-timeout }}
    if: ${{ needs.generate-matrix.outputs.deployments != '[]' }}
    strategy:
      matrix:
        deployment: ${{ fromJson(needs.generate-matrix.outputs.deployments) }}
    env:
      WORKING_DIRECTORY: ${{ matrix.deployment.path == '.' && './' || format('packages/{0}', matrix.deployment.path) }}
    steps:
      - uses: actions/checkout@v4
      - name: Download generated code
        uses: actions/download-artifact@v4
        with:
          name: generated-code
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter-version }}
          cache: true
      - name: Run flutter pub get
        run: flutter pub get --enforce-lockfile
      - name: Analyze project source
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: dart analyze --fatal-infos --fatal-warnings
      - name: Run Flutter ${{ matrix.deployment.path }} tests
        shell: bash
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: flutter test --no-pub --coverage
      - name: Setup LCOV
        if: ${{ !inputs.skip-reporting }}
        uses: hrishikesh-kadam/setup-lcov@v1
      - name: Report code coverage
        uses: zgosalvez/github-actions-report-lcov@v7.0.2
        if: ${{ !inputs.skip-reporting }}
        with:
          coverage-files: ${{ env.WORKING_DIRECTORY }}/coverage/lcov.info
          minimum-coverage: ${{ inputs.test-coverage }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ env.WORKING_DIRECTORY }}
          artifact-name: ${{ matrix.deployment.path }}-coverage
