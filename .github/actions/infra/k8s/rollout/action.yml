---
name: K8S Rollout
description: Restarts deployments matching the given criteria
inputs:
  vendor:
    description: The vendor to communicate with (azure, digitalocean, scaleway)
    required: true
  cluster-id:
    description: Target cluster ID
    required: true
  rollout-deployments:
    description: List of deployments to rollout (comma separated)
    required: false
  rollout-labels:
    description: List of labels to rollout (comma separated)
    required: false
  rollout-image:
    description: Image reference without tag; restarts deployments running this image
    required: false
  rollout-namespace:
    description: Rollout namespace filter
    required: true
  # Vendor: Azure
  azure-client-id:
    description: Azure client ID for login with an Azure service principal
    required: false
  azure-tenant-id:
    description: Azure tenant ID for login with an Azure service principal
    required: false
  azure-subscription-id:
    description: Azure subscription ID for login with an Azure service principal
    required: false
  azure-resource-group:
    description: Resource group name
    required: false
  # Vendor: DigitalOcean
  digitalocean-api-token:
    description: DigitalOcean API token
    required: false
  # Vendor: Scaleway
  scaleway-organization-id:
    description: Scaleway organization ID
    required: false
  scaleway-project-id:
    description: Scaleway project ID
    required: false
  scaleway-region:
    description: Scaleway deployment region (such as nl-ams)
    required: false
  scaleway-access-key:
    description: Scaleway API key ID
    required: false
  scaleway-secret-key:
    description: Scaleway API key secret
    required: false

runs:
  using: composite
  steps:
    # Vendor setup
    - uses: wisemen-digital/devops-github-actions/.github/actions/infra/k8s/setup@azure
      with:
        vendor: ${{ inputs.vendor }}
        cluster-id: ${{ inputs.cluster-id }}
        # Vendor: azure
        azure-client-id: ${{ inputs.azure-client-id }}
        azure-tenant-id: ${{ inputs.azure-tenant-id }}
        azure-subscription-id: ${{ inputs.azure-subscription-id }}
        azure-resource-group: ${{ inputs.azure-resource-group }}
        # Vendor: digitalocean
        digitalocean-api-token: ${{ inputs.digitalocean-api-token }}
        # Vendor: scaleway
        scaleway-organization-id: ${{ inputs.scaleway-organization-id }}
        scaleway-project-id: ${{ inputs.scaleway-project-id }}
        scaleway-region: ${{ inputs.scaleway-region }}
        scaleway-access-key: ${{ inputs.scaleway-access-key }}
        scaleway-secret-key: ${{ inputs.scaleway-secret-key }}

    # Rollout
    - name: Restart deployments
      shell: bash
      env:
        DEPLOYMENTS: ${{ inputs.rollout-deployments }}
        LABELS: ${{ inputs.rollout-labels }}
        IMAGE: ${{ inputs.rollout-image }}
        NAMESPACE: ${{ inputs.rollout-namespace }}
        VENDOR: ${{ inputs.vendor }}
        CLUSTER_ID: ${{ inputs.cluster-id }}
        AZURE_RESOURCE_GROUP: ${{ inputs.azure-resource-group }}
      run: |
        # Azure clusters are private: their API server only resolves inside the
        # VNet, so kubectl cannot reach them from a hosted runner. Tunnel the
        # command through the Azure control plane instead.
        run_cmd() {
          if [ "$VENDOR" != "azure" ]; then
            eval "$*"
            return
          fi

          local result
          result=`az aks command invoke \
            --name "$CLUSTER_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --command "$*" \
            --output json`

          jq -r '.logs // ""' <<< "$result"

          # `az aks command invoke` exits 0 even when the remote command failed,
          # so the remote exit code has to be checked explicitly.
          local state
          local code
          state=`jq -r '.provisioningState // ""' <<< "$result"`
          code=`jq -r '.exitCode // 1' <<< "$result"`

          if [ "$state" != "Succeeded" ]; then
            echo "::error::Run command did not complete (state: $state): $*" >&2
            return 1
          fi
          if [ "$code" != "0" ]; then
            echo "::error::Command failed on cluster with exit code $code: $*" >&2
            return "$code"
          fi
        }

        # Restart multiple deployments
        if [ -n "$DEPLOYMENTS" ]; then
          for deployment in ${DEPLOYMENTS//,/ }; do
            run_cmd kubectl rollout restart deployment \
              "$deployment" \
              --namespace="$NAMESPACE"
          done

        # Restart multiple labels
        elif [ -n "$LABELS" ]; then
          run_cmd kubectl rollout restart deployment \
            --selector="$LABELS" \
            --namespace="$NAMESPACE"

        # Restart deployments running the image
        # jq stays on the runner, so the cluster only has to run plain kubectl
        elif [ -n "$IMAGE" ]; then
          deployments=`run_cmd kubectl get deployment --namespace="$NAMESPACE" -o json \
            | jq -r --arg img "$IMAGE" '.items[] | select(any(.spec.template.spec.containers[]; .image | startswith($img + ":"))) | .metadata.name' \
            | tr '\n' ' '`

          if [ -n "${deployments// /}" ]; then
            run_cmd kubectl rollout restart deployment $deployments \
              --namespace="$NAMESPACE"
          else
            echo "No deployments running image $IMAGE; nothing to restart."
          fi

        # Restart everything
        else
          run_cmd kubectl rollout restart deployment \
            --namespace="$NAMESPACE"
        fi
