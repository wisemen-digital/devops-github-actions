---
name: K8S Rollout
description: Restarts deployments matching the given criteria
inputs:
  vendor:
    description: The vendor to communicate with (azure, digitalocean, scaleway)
    required: true
  cluster-id:
    description: Target cluster ID
    required: true
  rollout-deployments:
    description: Explicit list of deployments to rollout (comma separated). Overrides image/labels.
    required: false
  rollout-labels:
    description: Label selector to rollout (comma separated). Overrides image matching.
    required: false
  rollout-image:
    description: >
      Image reference (without tag) to match. Restarts every deployment whose pods run this image.
      Used when neither rollout-deployments nor rollout-labels is set (the default mechanism).
    required: false
  rollout-namespace:
    description: Rollout namespace filter
    required: true
  # Vendor: Azure
  azure-client-id:
    description: Azure client ID for login with an Azure service principal
    required: false
  azure-tenant-id:
    description: Azure tenant ID for login with an Azure service principal
    required: false
  azure-subscription-id:
    description: Azure subscription ID for login with an Azure service principal
    required: false
  azure-resource-group:
    description: Resource group name
    required: false
  # Vendor: DigitalOcean
  digitalocean-api-token:
    description: DigitalOcean API token
    required: false
  # Vendor: Scaleway
  scaleway-organization-id:
    description: Scaleway organization ID
    required: false
  scaleway-project-id:
    description: Scaleway project ID
    required: false
  scaleway-region:
    description: Scaleway deployment region (such as nl-ams)
    required: false
  scaleway-access-key:
    description: Scaleway API key ID
    required: false
  scaleway-secret-key:
    description: Scaleway API key secret
    required: false

runs:
  using: composite
  steps:
    # Vendor setup
    - uses: wisemen-digital/devops-github-actions/.github/actions/infra/k8s/setup@main
      with:
        vendor: ${{ inputs.vendor }}
        cluster-id: ${{ inputs.cluster-id }}
        # Vendor: azure
        azure-client-id: ${{ inputs.azure-client-id }}
        azure-tenant-id: ${{ inputs.azure-tenant-id }}
        azure-subscription-id: ${{ inputs.azure-subscription-id }}
        azure-resource-group: ${{ inputs.azure-resource-group }}
        # Vendor: digitalocean
        digitalocean-api-token: ${{ inputs.digitalocean-api-token }}
        # Vendor: scaleway
        scaleway-organization-id: ${{ inputs.scaleway-organization-id }}
        scaleway-project-id: ${{ inputs.scaleway-project-id }}
        scaleway-region: ${{ inputs.scaleway-region }}
        scaleway-access-key: ${{ inputs.scaleway-access-key }}
        scaleway-secret-key: ${{ inputs.scaleway-secret-key }}

    # Rollout
    - name: Restart deployments
      shell: bash
      env:
        DEPLOYMENTS: ${{ inputs.rollout-deployments }}
        LABELS: ${{ inputs.rollout-labels }}
        IMAGE: ${{ inputs.rollout-image }}
        NS: ${{ inputs.rollout-namespace }}
      run: |
        # Restart explicit deployments (override)
        if [ -n "$DEPLOYMENTS" ]; then
          for deployment in ${DEPLOYMENTS//,/ }; do
            kubectl rollout restart deployment "$deployment" --namespace="$NS"
          done

        # Restart by label selector (override)
        elif [ -n "$LABELS" ]; then
          kubectl rollout restart deployment --selector="$LABELS" --namespace="$NS"

        # Restart every deployment running the built image (default)
        elif [ -n "$IMAGE" ]; then
          kubectl get deployment --namespace="$NS" -o json \
            | jq -r --arg img "$IMAGE" \
                '.items[]
                 | select(any(.spec.template.spec.containers[]; .image | startswith($img + ":")))
                 | .metadata.name' \
            | xargs -r kubectl rollout restart deployment --namespace="$NS"

        # Restart everything (fallback)
        else
          kubectl rollout restart deployment --namespace="$NS"
        fi
