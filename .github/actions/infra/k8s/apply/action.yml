---
name: K8S Apply
description: Apply config changes for the given path
inputs:
  vendor:
    description: The vendor to communicate with (azure, digitalocean, scaleway)
    required: true
  cluster-id:
    description: Target cluster ID
    required: true
  checkout-path:
    description: Folder to checkout (defaults to k8s)
    required: false
    default: k8s
  config-path:
    description: Path to configuration
    required: true
  github-access-token:
    description: GitHub access token (GITHUB_TOKEN)
    required: true
  # Vendor: Azure
  azure-client-id:
    description: Azure client ID for login with an Azure service principal
    required: false
  azure-tenant-id:
    description: Azure tenant ID for login with an Azure service principal
    required: false
  azure-subscription-id:
    description: Azure subscription ID for login with an Azure service principal
    required: false
  azure-resource-group:
    description: Resource group name
    required: false
  # Vendor: DigitalOcean
  digitalocean-api-token:
    description: DigitalOcean API token
    required: false
  # Vendor: Scaleway
  scaleway-organization-id:
    description: Scaleway organization ID
    required: false
  scaleway-project-id:
    description: Scaleway project ID
    required: false
  scaleway-region:
    description: Scaleway deployment region (such as nl-ams)
    required: false
  scaleway-access-key:
    description: Scaleway API key ID
    required: false
  scaleway-secret-key:
    description: Scaleway API key secret
    required: false

runs:
  using: composite
  steps:
    # Vendor setup
    - uses: wisemen-digital/devops-github-actions/.github/actions/infra/k8s/setup@test/azure-private-cluster-invoke
      with:
        vendor: ${{ inputs.vendor }}
        cluster-id: ${{ inputs.cluster-id }}
        # Vendor: azure
        azure-client-id: ${{ inputs.azure-client-id }}
        azure-tenant-id: ${{ inputs.azure-tenant-id }}
        azure-subscription-id: ${{ inputs.azure-subscription-id }}
        azure-resource-group: ${{ inputs.azure-resource-group }}
        # Vendor: digitalocean
        digitalocean-api-token: ${{ inputs.digitalocean-api-token }}
        # Vendor: scaleway
        scaleway-organization-id: ${{ inputs.scaleway-organization-id }}
        scaleway-project-id: ${{ inputs.scaleway-project-id }}
        scaleway-region: ${{ inputs.scaleway-region }}
        scaleway-access-key: ${{ inputs.scaleway-access-key }}
        scaleway-secret-key: ${{ inputs.scaleway-secret-key }}

    # Get & apply config
    - name: Checkout
      uses: actions/checkout@v7
      with:
        sparse-checkout: |
          ${{ inputs.checkout-path }}
    - name: Ensure access to private repositories
      shell: bash
      run: |
        AUTH="x-access-token:${{ inputs.github-access-token }}"
        git config --global url."https://${AUTH}@github.com/".insteadOf "git@github.com:"
    - name: Apply config
      shell: bash
      env:
        VENDOR: ${{ inputs.vendor }}
        CLUSTER_ID: ${{ inputs.cluster-id }}
        AZURE_RESOURCE_GROUP: ${{ inputs.azure-resource-group }}
        CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        # Azure clusters are private: their API server only resolves inside the
        # VNet, so kubectl cannot reach them from a hosted runner. Tunnel the
        # command through the Azure control plane instead.
        run_cmd() {
          if [ "$VENDOR" != "azure" ]; then
            eval "$*"
            return
          fi

          local result
          result=`az aks command invoke \
            --name "$CLUSTER_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --file "$manifest_file" \
            --command "$*" \
            --output json`

          jq -r '.logs // ""' <<< "$result"

          # `az aks command invoke` exits 0 even when the remote command failed,
          # so the remote exit code has to be checked explicitly.
          local state
          local code
          state=`jq -r '.provisioningState // ""' <<< "$result"`
          code=`jq -r '.exitCode // 1' <<< "$result"`

          if [ "$state" != "Succeeded" ]; then
            echo "::error::Run command did not complete (state: $state): $*" >&2
            return 1
          fi
          if [ "$code" != "0" ]; then
            echo "::error::Command failed on cluster with exit code $code: $*" >&2
            return "$code"
          fi
        }

        # Pre-render kustomize so the manifest can be sent to the cluster
        manifest_file=`mktemp --tmpdir=. --suffix .yaml`
        kubectl kustomize "$CONFIG_PATH" > "$manifest_file"

        # Apply k8s config
        run_cmd kubectl apply -f "$manifest_file"
