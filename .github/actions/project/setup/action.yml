---
name: Prep. project environment
description: |
  Prepare the Node / PNPM environment
inputs:
  apps:
    description: List of changed apps (build matrix generated by earlier job)
    required: true
  filtered-install:
    description: Only install the workspace root and the given apps (with their workspace dependencies)
    required: false
    default: 'false'
  node-runtime:
    description: Node Runtime (such as `node@24`)
    required: false
    default: 'node@lts'
outputs:
  pnpm-filter-args:
    description: Arguments for a `pnpm` command to only trigger for the given apps
    value: ${{ steps.values.outputs.pnpm_filter_args }}

runs:
  using: composite
  steps:
    # Calculate values
    - name: Calculate values
      shell: bash
      id: values
      run: |
        changed_apps=`echo '${{ inputs.apps }}' | jq -r '.[]? | select(.skip != true) | .path'`

        FILTER_ARGS=()
        INSTALL_FILTER_ARGS=(--filter .)
        while IFS= read -r item; do
          [[ -n "$item" ]] || continue
          FILTER_ARGS+=(--filter "${item}")
          INSTALL_FILTER_ARGS+=(--filter "{./${item}}...")
        done <<< "$changed_apps"

        # Apps given but all skipped: commands run unfiltered, so install everything
        if [[ ${#FILTER_ARGS[@]} -eq 0 && '${{ inputs.apps }}' != '' && '${{ inputs.apps }}' != '[]' ]]; then
          INSTALL_FILTER_ARGS=()
        fi

        echo "pnpm_filter_args=${FILTER_ARGS[@]}" >> "$GITHUB_OUTPUT"
        echo "pnpm_install_filter_args=${INSTALL_FILTER_ARGS[@]}" >> "$GITHUB_OUTPUT"
    # Disable telemetry
    - name: Disable Turbo telemetry
      shell: bash
      if: ${{ hashFiles('turbo.json') != '' }}
      run: |
        echo "Disabling `turbo` telemtry…"
        echo "TURBO_TELEMETRY_DISABLED=1" >> $GITHUB_ENV
    # Prep. Node environment
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install pnpm
      uses: pnpm/setup@v2
      with:
        cache: true
        install: false
        runtime: ${{ inputs.node-runtime }}
    - name: Install dependencies
      shell: bash
      env:
        FILTER_ARGS: ${{ inputs.filtered-install == 'true' && steps.values.outputs.pnpm_install_filter_args || '' }}
      run: pnpm install --frozen-lockfile --prefer-offline --no-runtime $FILTER_ARGS
